spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saung_era_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}

jwt.access-token-validity=${ACCESS_TOKEN_VALIDITY:900000}
jwt.refresh-token-validity=${REFRESH_TOKEN_VALIDITY:604800000}
jwt.secret=${JWT_SECRET_KEY}
jwt.issuer=${JWT_ISSUER}